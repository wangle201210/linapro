# LinaPro manually triggered Docker image publishing workflow.
# LinaPro 手动触发 Docker 镜像发布工作流。
name: Build and Push Docker Image

on:
  # Allow maintainers to publish a branch image on demand.
  # 允许维护者按需发布分支镜像。
  workflow_dispatch:

# The top-level workflow stays read-only; package write access is scoped to the publishing job.
# 顶层工作流保持只读；包写权限只授予发布 job。
permissions:
  contents: read

# Avoid concurrent writes to the same branch image target.
# 避免同一分支镜像目标并发写入。
concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Publish branch and manual runs as the short commit SHA.
  # 分支和手动运行按短 commit SHA 发布。
  docker-image:
    name: Build and publish Docker image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-image-publish.yml
    with:
      image-name: linapro
      platforms: linux/amd64,linux/arm64
      tag-mode: sha
      plugins: "1"
