# Reusable LinaPro multi-platform image publishing workflow.
# LinaPro 可复用多平台镜像发布工作流。
name: Reusable Image Publish

on:
  # Expose image publication as a reusable workflow for nightly and release callers.
  # 将镜像发布暴露为可复用工作流，供 nightly 和 release 调用。
  workflow_call:
    inputs:
      # Selects the GHCR image name below the repository owner namespace.
      # 选择仓库 owner 命名空间下的 GHCR 镜像名称。
      image-name:
        description: Container image name.
        required: false
        type: string
        default: linapro
      # Selects the target architectures for docker buildx.
      # 选择 docker buildx 的目标架构。
      platforms:
        description: Comma-separated target platforms for docker buildx.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      # Controls whether the immutable tag is date-based nightly, the Git release tag, or commit SHA.
      # 控制不可变标签使用日期型 nightly、Git 发布标签或提交 SHA。
      tag-mode:
        description: "Image tag strategy: nightly, release, or sha."
        required: true
        type: string
      # Publishes an additional moving tag such as nightly or latest.
      # 额外发布一个可移动标签，例如 nightly 或 latest。
      floating-tag:
        description: Floating tag to publish after the immutable tag.
        required: false
        type: string
        default: ""
      # Lets release callers verify the moving tag after it is updated.
      # 允许 release 调用方在移动标签更新后执行检查。
      inspect-floating-tag:
        description: Whether to inspect the floating tag after publication.
        required: false
        type: boolean
        default: false
      # Passes host-only or plugin-full mode into make image.
      # 将宿主或插件完整模式传给 make image。
      plugins:
        description: Official plugin build mode passed to make image.
        required: false
        type: string
        default: "1"
      # Requires official plugin manifests before building plugin-full images.
      # 在构建插件完整镜像前要求官方插件清单存在。
      require-plugin-workspace:
        description: Whether official plugin manifests must be present before image build.
        required: false
        type: boolean
        default: true

# Image publication needs repository read access and package write access for GHCR.
# 镜像发布需要读取仓库，并需要 GHCR 包写权限。
permissions:
  contents: read
  packages: write

# Keep image metadata, logs, and generated nightly dates aligned with the project timezone.
# 让镜像元数据、日志和生成的 nightly 日期与项目时区保持一致。
env:
  TZ: "Asia/Shanghai"

jobs:
  # Computes immutable image metadata and normalizes the platform list once.
  # 统一计算不可变镜像元数据，并规范化平台列表。
  metadata:
    name: Prepare image metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image-ref: ${{ steps.image.outputs.image_ref }}
      image-name: ${{ steps.image.outputs.image_name }}
      image-tag: ${{ steps.image.outputs.image_tag }}
      platforms: ${{ steps.image.outputs.platforms }}
      platforms-json: ${{ steps.image.outputs.platforms_json }}
      registry: ${{ steps.image.outputs.registry }}

    steps:
      # Normalize registry names and compute the immutable image tag for branch, nightly, or release publishing.
      # 归一化 registry 名称，并计算分支、nightly 或 release 发布使用的不可变镜像标签。
      - name: Prepare Image Metadata
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORMS: ${{ inputs.platforms }}
          TAG_MODE: ${{ inputs.tag-mode }}
          FLOATING_TAG: ${{ inputs.floating-tag }}
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          registry="ghcr.io/${owner}"
          image_ref="${registry}/${image_name}"

          case "${TAG_MODE}" in
            nightly)
              image_tag="nightly-$(date +'%Y%m%d')"
              ;;
            release)
              image_tag="${GITHUB_REF_NAME}"
              if ! printf '%s' "${image_tag}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
                echo "Git tag ${image_tag} cannot be used as a Docker image tag." >&2
                exit 1
              fi
              ;;
            sha)
              image_tag="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
              ;;
            *)
              echo "Unsupported tag mode: ${TAG_MODE}" >&2
              exit 1
              ;;
          esac

          platforms_json="["
          normalized_platforms=""
          first_platform=1
          IFS=',' read -r -a platform_items <<< "${PLATFORMS}"
          for raw_platform in "${platform_items[@]}"; do
            platform="${raw_platform#"${raw_platform%%[![:space:]]*}"}"
            platform="${platform%"${platform##*[![:space:]]}"}"
            if [ -z "${platform}" ]; then
              continue
            fi
            if ! printf '%s' "${platform}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
              echo "Invalid Docker platform: ${platform}" >&2
              exit 1
            fi

            if [ "${first_platform}" -eq 1 ]; then
              first_platform=0
              platforms_json="${platforms_json}\"${platform}\""
              normalized_platforms="${platform}"
            else
              platforms_json="${platforms_json},\"${platform}\""
              normalized_platforms="${normalized_platforms},${platform}"
            fi
          done
          platforms_json="${platforms_json}]"

          if [ "${first_platform}" -eq 1 ]; then
            echo "No Docker platforms were configured." >&2
            exit 1
          fi

          {
            echo "registry=${registry}"
            echo "image_name=${image_name}"
            echo "image_tag=${image_tag}"
            echo "image_ref=${image_ref}"
            echo "platforms=${normalized_platforms}"
            echo "platforms_json=${platforms_json}"
          } >> "${GITHUB_OUTPUT}"

          if [ -n "${FLOATING_TAG}" ]; then
            echo "Publishing ${image_ref}:${image_tag} and ${image_ref}:${FLOATING_TAG} for ${normalized_platforms}"
          else
            echo "Publishing ${image_ref}:${image_tag} for ${normalized_platforms}"
          fi

  # Builds and pushes each platform image independently so host binaries compile in parallel.
  # 独立构建并推送每个平台镜像，让宿主二进制跨平台构建并行执行。
  platform-image:
    name: Build and publish image (${{ matrix.platform }})
    needs:
      - metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.metadata.outputs.platforms-json) }}

    steps:
      # Check out repository sources and official plugin submodules for full image builds.
      # 拉取仓库源码和官方插件 submodule，用于完整镜像构建。
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Fail fast when plugin-full image publication cannot see official plugin manifests.
      # 当插件完整镜像发布看不到官方插件清单时快速失败。
      - name: Verify Official Plugin Workspace
        if: ${{ inputs.require-plugin-workspace }}
        uses: ./.github/actions/verify-official-plugin-workspace

      # Install Go for backend build tooling and linactl image helpers.
      # 安装后端构建工具和 linactl image helper 所需的 Go。
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      # Install the pinned pnpm version without installing packages yet.
      # 安装固定版本 pnpm，但暂不安装项目依赖。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.30.3"
          run_install: false

      # Install the frontend Node version and configure pnpm dependency caching.
      # 安装前端 Node 版本并配置 pnpm 依赖缓存。
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "apps/lina-vben/.node-version"
          cache: "pnpm"
          cache-dependency-path: "apps/lina-vben/pnpm-lock.yaml"

      # Install frontend dependencies needed by the image build.
      # 安装镜像构建所需的前端依赖。
      - name: Install Frontend Dependencies
        working-directory: apps/lina-vben
        run: pnpm install --frozen-lockfile

      # Enable emulation for non-native target platforms.
      # 为非本机目标平台启用模拟。
      - name: Setup QEMU
        if: ${{ matrix.platform != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3

      # Authenticate to GitHub Container Registry using the workflow token.
      # 使用工作流 token 登录 GitHub Container Registry。
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build and push a single-platform image tag. The final manifest job will merge these tags.
      # 构建并推送单平台临时标签，最终 manifest job 会合并这些标签。
      - name: Build and Push Platform Image
        env:
          IMAGE_NAME: ${{ needs.metadata.outputs.image-name }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image-tag }}
          PLATFORM: ${{ matrix.platform }}
          REGISTRY: ${{ needs.metadata.outputs.registry }}
        run: |
          platform_slug="${PLATFORM//\//-}"
          platform_tag="${IMAGE_TAG}-${platform_slug}"
          echo "Publishing ${REGISTRY}/${IMAGE_NAME}:${platform_tag} for ${PLATFORM}"

          make image \
            config=".github/image/config.yaml" \
            platforms="${PLATFORM}" \
            registry="${REGISTRY}" \
            image="${IMAGE_NAME}" \
            tag="${platform_tag}" \
            plugins="${{ inputs.plugins }}" \
            push=1

  # Merges platform tags into the public immutable manifest and updates the optional floating tag.
  # 将平台临时标签合并成公开不可变 manifest，并更新可选浮动标签。
  publish-manifest:
    name: Publish multi-platform manifest
    needs:
      - metadata
      - platform-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Create the Docker Buildx builder used for manifest tooling.
      # 创建用于 manifest 工具的 Docker Buildx builder。
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry using the workflow token.
      # 使用工作流 token 登录 GitHub Container Registry。
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publish the immutable manifest list from platform-specific image tags.
      # 基于平台临时标签发布不可变 manifest list。
      - name: Publish Immutable Manifest
        env:
          IMAGE_REF: ${{ needs.metadata.outputs.image-ref }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image-tag }}
          PLATFORMS: ${{ needs.metadata.outputs.platforms }}
        run: |
          refs=()
          IFS=',' read -r -a platform_items <<< "${PLATFORMS}"
          for platform in "${platform_items[@]}"; do
            platform_slug="${platform//\//-}"
            refs+=("${IMAGE_REF}:${IMAGE_TAG}-${platform_slug}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE_REF}:${IMAGE_TAG}" \
            "${refs[@]}"

      # Point the moving tag at the just-published immutable image tag.
      # 将移动标签指向刚发布的不可变镜像标签。
      - name: Publish Floating Tag
        if: ${{ inputs.floating-tag != '' }}
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.metadata.outputs.image-ref }}:${{ inputs.floating-tag }}" \
            "${{ needs.metadata.outputs.image-ref }}:${{ needs.metadata.outputs.image-tag }}"

      # Inspect the immutable manifest so platform metadata is visible in logs.
      # 检查不可变 manifest，让平台元数据出现在日志中。
      - name: Inspect Published Manifest
        run: |
          docker buildx imagetools inspect "${{ needs.metadata.outputs.image-ref }}:${{ needs.metadata.outputs.image-tag }}"

      # Optionally inspect the moving manifest, used by release to verify latest.
      # 可选检查移动 manifest，release 用它验证 latest。
      - name: Inspect Floating Manifest
        if: ${{ inputs.inspect-floating-tag && inputs.floating-tag != '' }}
        run: |
          docker buildx imagetools inspect "${{ needs.metadata.outputs.image-ref }}:${{ inputs.floating-tag }}"
