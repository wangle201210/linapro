{include file=comm/head.html}
<link rel="stylesheet" href="{cms:sitetplpath}/css/yx-page.css">
<div class="container" data-testid="cms-public-site" data-template="detail">
  <div class="breadcrumb">
    {cms:position separator='<span class="sep">&gt;</span>'}
  </div>
  <div class="page-content">
    {include file=comm/sortnav.html}
    <div class="content-area">
      <div class="article-detail" data-testid="cms-public-article-detail">
        <div class="article-detail-header">
          <h1>{content:title}</h1>
          <div class="article-meta">
            <span>发布时间：{content:date style=Y-m-d}</span>
            <span>来源：{cms:companyname}</span>
            <span>浏览：{content:visits}次</span>
          </div>
        </div>
        <div class="article-body">
          {content:content}
        </div>
        <div class="article-nav">
          <div>上一篇：{content:precontent}</div>
          <div>下一篇：{content:nextcontent}</div>
        </div>
      </div>
      <a href="{sort:link}" class="back-to-list">返回列表</a>
    </div>
  </div>
</div>
{include file=comm/foot.html}
